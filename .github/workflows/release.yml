# Publie une release GitHub quand un tag « vX.Y.Z » est poussé :
#   git tag v2.0.0 && git push origin v2.0.0
# ou à la main (onglet Actions > Release > Run workflow) en indiquant la version :
# le tag est alors créé sur le commit choisi.
# L'archive LiveChat-win-x64.zip et sa somme SHA-256 sont celles qu'utilise la mise à jour automatique.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier (ex. v2.0.1)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version || github.ref_name }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Tester
        run: dotnet test LiveChat.sln --configuration Release

      - name: Publier
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v')
          # Version autonome : un seul exe, runtime .NET inclus (voir Properties/PublishProfiles/win-x64.pubxml).
          dotnet publish src/LiveChat/LiveChat.csproj `
            -p:PublishProfile=win-x64 `
            -p:Version=$version `
            --output publish
          Compress-Archive -Path publish/* -DestinationPath LiveChat-win-x64.zip
          $hash = (Get-FileHash LiveChat-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  LiveChat-win-x64.zip" | Out-File -Encoding ascii -NoNewline LiveChat-win-x64.zip.sha256

      - name: Créer la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG LiveChat-win-x64.zip LiveChat-win-x64.zip.sha256 `
            --target '${{ github.sha }}' `
            --title "LiveChat $env:TAG" `
            --generate-notes
